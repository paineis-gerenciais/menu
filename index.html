<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painéis Gerenciais</title>
<meta name="description" content="Menu geral dos Painéis Gerenciais.">
<link rel="preload" as="image" href="assets/logo.webp" type="image/webp">
<link rel="icon" href="data:,">
<style>
  :root {
    --vermelho: #8b0a0a;
    --dourado: #d4a24c;
    --texto: #3a2a2a;
    --veu: rgba(255, 255, 255, .55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    background: #f7f3f2;
    display: flex;
    flex-direction: column;
  }
  /* Fundo fixo em camada própria (background-attachment: fixed falha no iOS) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(var(--veu), var(--veu)), url("assets/fundo.webp") center / cover no-repeat;
  }
  header { text-align: center; padding: 40px 16px 8px; }
  header img { width: min(480px, 85vw); height: auto; }
  h1 {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  main { flex: 1; padding: 16px 16px 40px; }
  .grade {
    list-style: none;
    margin: 0 auto;
    padding: 0;
    max-width: 1160px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 20px;
  }
  .grade a {
    display: block;
    border-radius: 18px;
    transition: transform .18s ease, filter .18s ease;
  }
  .grade a:hover { transform: translateY(-3px) scale(1.02); filter: brightness(1.08) drop-shadow(0 8px 14px rgba(139, 10, 10, .25)); }
  .grade a:active { transform: translateY(0) scale(.99); }
  .grade a:focus-visible { outline: 3px solid var(--dourado); outline-offset: 2px; }
  .grade img { display: block; width: 100%; height: auto; }
  footer { text-align: center; font-size: 13px; padding: 0 16px 20px; color: #6b5a5a; }
  @media (max-width: 900px) { .grade { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) {
    header { padding-top: 28px; }
    .grade { grid-template-columns: 1fr; max-width: 420px; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { .grade a { transition: none; } }
</style>
</head>
<body>
<header>
  <img src="assets/logo.webp" width="720" height="251" alt="Painéis Gerenciais">
  <h1>Painéis Gerenciais</h1>
</header>
<main>
  <nav aria-label="Painéis">
    <ul class="grade">
      <li><a href="https://paineis-gerenciais.github.io/gestao-projetos/" target="_blank" rel="noopener" aria-label="Gestão de Projetos (abre em nova aba)"><img src="assets/btn-gestao-projetos.webp" width="720" height="240" alt=""></a></li>
      <li><a href="https://paineis-gerenciais.github.io/organograma/" target="_blank" rel="noopener" aria-label="Organograma (abre em nova aba)"><img src="assets/btn-organograma.webp" width="720" height="240" alt=""></a></li>
      <li><a href="https://paineis-gerenciais.github.io/processos/" target="_blank" rel="noopener" aria-label="Processos (abre em nova aba)"><img src="assets/btn-processos.webp" width="720" height="240" alt=""></a></li>
      <li><a href="https://paineis-gerenciais.github.io/gestao-mudancas/" target="_blank" rel="noopener" aria-label="Gestão de Mudanças (abre em nova aba)"><img src="assets/btn-gestao-mudancas.webp" width="720" height="240" alt="" loading="lazy"></a></li>
      <li><a href="https://paineis-gerenciais.github.io/cadeia-valor/" target="_blank" rel="noopener" aria-label="Cadeia de Valor (abre em nova aba)"><img src="assets/btn-cadeia-valor.webp" width="720" height="240" alt="" loading="lazy"></a></li>
      <li><a href="https://paineis-gerenciais.github.io/matriz-risco/" target="_blank" rel="noopener" aria-label="Matriz de Risco (abre em nova aba)"><img src="assets/btn-matriz-risco.webp" width="720" height="240" alt="" loading="lazy"></a></li>
      <li><a href="https://paineis-gerenciais.github.io/matriz-stakeholders/" target="_blank" rel="noopener" aria-label="Matriz de Stakeholders (abre em nova aba)"><img src="assets/btn-matriz-stakeholders.webp" width="720" height="240" alt="" loading="lazy"></a></li>
      <li><a href="https://paineis-gerenciais.github.io/autoavaliacao/" target="_blank" rel="noopener" aria-label="Autoavaliação de Gestores (abre em nova aba)"><img src="assets/btn-autoavaliacao-gestores.webp" width="720" height="240" alt="" loading="lazy"></a></li>
      <li><a href="em-breve.html" target="_blank" rel="noopener" aria-label="Outros (abre em nova aba)"><img src="assets/btn-outros.webp" width="720" height="240" alt="" loading="lazy"></a></li>
    </ul>
  </nav>
</main>
<footer>Painéis Gerenciais</footer>
</body>
</html>
